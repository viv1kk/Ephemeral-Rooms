name: CI

# Runs on every branch, on pull requests, and once a week.
#
# The weekly run is not padding. The whole collaboration design rests on the
# browser's `yjs` and the server's `pycrdt` agreeing on a binary wire format,
# and that agreement can be broken by a transitive dependency without anyone
# touching this repository. A scheduled run turns "remember to re-check" into
# an email.

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    # Mondays, 04:17 UTC. Off the hour so it is not queued behind everyone
    # else's midnight cron.
    - cron: '17 4 * * 1'
  workflow_dispatch:

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '24'
  PYTHONUNBUFFERED: '1'

jobs:
  backend:
    name: Backend tests and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # `--only-binary=:all:` is an assertion, not a speed-up. Every pinned
          # dependency must publish a Linux wheel, because deploy/bootstrap.sh
          # installs with the same flag on an instance that has no compiler and
          # no Rust toolchain. Failing here means failing there, which is the
          # far cheaper place to find out.
          pip install --only-binary=:all: -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: backend
        run: pytest -q

      - name: Type check
        working-directory: backend
        run: mypy

  frontend:
    name: Frontend types and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build

      # Deployment copies this to the instance, because Node is a build-time
      # dependency only and is never installed on the server.
      - name: Upload production bundle
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  e2e:
    name: Browser end-to-end
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: -r requirements.txt
          pip install -r requirements-dev.txt

      # The suite runs Vite from source rather than from dist, so it needs
      # node_modules even though the frontend job already built a bundle.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      # Starts its own Uvicorn and Vite on ports 8010 and 5174, drives two
      # independent browser contexts against them, and proves that browser yjs
      # and server pycrdt converge on the same binary format. A pure-Python
      # test of pycrdt against itself would prove nothing about that.
      # e2e/manual holds a headed reproduction that needs a real window
      # manager to be meaningful; it is documented and run by hand.
      - name: Run end-to-end tests
        run: pytest e2e -q --ignore=e2e/manual

  pinned-versions:
    name: Pinned CRDT versions match the README
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # The README records a verified five-package quintet and states that
      # upgrading any of them requires re-running the compatibility test. This
      # makes that rule enforceable: bump a version without updating the
      # README and CI stops you, rather than the mismatch being discovered
      # later as text quietly ordering differently.
      - name: Check the quintet
        run: |
          set -euo pipefail
          fail=0
          check() {
            local name=$1 version=$2
            if [ -z "$version" ]; then
              echo "::error::could not read the pinned version of $name"
              fail=1
            elif grep -qF "$version" README.md; then
              echo "  ok   $name $version"
            else
              echo "::error::$name is pinned to $version but the README does not mention that version. Update the verified quintet table, and re-run the compatibility test (e2e) before doing so."
              fail=1
            fi
          }

          check pycrdt            "$(sed -n 's/^pycrdt==\(.*\)$/\1/p'            backend/requirements.txt)"
          check pycrdt-websocket  "$(sed -n 's/^pycrdt-websocket==\(.*\)$/\1/p'  backend/requirements.txt)"
          check yjs               "$(node -p "require('./frontend/package.json').dependencies['yjs']")"
          check y-protocols       "$(node -p "require('./frontend/package.json').dependencies['y-protocols']")"
          check y-codemirror.next "$(node -p "require('./frontend/package.json').dependencies['y-codemirror.next']")"

          exit $fail

  deploy:
    name: Deploy to EC2
    # Runs only after every check above has passed. This is the whole point of
    # keeping deployment in the same workflow rather than chaining a second
    # one: the dependency is a single graph, not a fragile workflow_run trigger.
    needs: [backend, frontend, e2e, pinned-versions]

    # Three independent guards, because an accidental deployment here is not a
    # rollback - it destroys every live room (see below).
    #   1. only the main branch
    #   2. only a real push, never a PR or the weekly schedule
    #   3. only once DEPLOY_ENABLED is set, so this stays inert until an
    #      instance actually exists
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.DEPLOY_ENABLED == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Naming an environment lets you add a required reviewer in the repository
    # settings without touching this file, turning the deploy into a one-click
    # approval. Worth considering: a deploy restarts the service, and a restart
    # loses every active room and every uploaded file by design. Anyone mid-session
    # is disconnected with no warning.
    environment:
      name: production
      url: https://${{ vars.DEPLOY_DOMAIN }}

    permissions:
      contents: read
      actions: read      # to download the frontend bundle built above

    steps:
      - uses: actions/checkout@v7

      # Reuse the exact bundle CI tested rather than rebuilding it here. Node
      # is never installed on the instance, so the built assets have to travel.
      - name: Download the production bundle
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Verify the bundle arrived
        run: |
          test -f frontend/dist/index.html \
            || { echo "::error::frontend/dist/index.html is missing; bootstrap.sh would refuse to run"; exit 1; }
          echo "bundle: $(find frontend/dist -type f | wc -l) files"

      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pin the host key if one is provided; otherwise trust on first use.
          # Providing DEPLOY_KNOWN_HOSTS is strictly better, because keyscan
          # accepts whatever answers on the day.
          if [ -n "${{ secrets.DEPLOY_KNOWN_HOSTS }}" ]; then
            printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Copy the application to the instance
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o BatchMode=yes" \
            --exclude '.git' --exclude 'node_modules' --exclude '.venv' \
            --exclude '__pycache__' --exclude '.pytest_cache' --exclude '.mypy_cache' \
            ./ "$USER@$HOST:/tmp/ephemeral-rooms/"

      # bootstrap.sh is idempotent, so this is both the first install and every
      # subsequent redeploy. It preflights, installs from wheels only, refuses
      # a unit file that has lost its --workers 1, and smoke-tests itself.
      - name: Run the provisioner
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$USER@$HOST" \
            "cd /tmp/ephemeral-rooms && sudo ./deploy/bootstrap.sh '$DOMAIN'"

      # Prove the deployed thing actually answers, rather than trusting that
      # the script exited zero.
      - name: Verify the live site
        env:
          DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' "https://$DOMAIN/" || echo 000)
            if [ "$code" = "200" ]; then
              echo "landing page: $code"
              room=$(curl -fsS -X POST "https://$DOMAIN/api/rooms")
              echo "created a room: $room"
              case "$room" in *roomCode*) exit 0 ;; esac
            fi
            echo "attempt $attempt: HTTP $code; retrying"
            sleep 5
          done
          echo "::error::the deployed site did not answer correctly"
          exit 1

  # ===========================================================================
  # Continuous deployment, part one: publish.
  #
  # Builds each image, PROVES IT RUNS, and only then pushes it to Docker Hub.
  # The four jobs above prove the source is good; they say nothing about the
  # artifact. A missing wheel, a broken entrypoint or an Nginx config that fails
  # to parse all produce a green test suite and an image that will not start.
  # This job is the difference between "the code was fine" and "the thing we are
  # about to deploy runs".
  #
  # Part two is Watchtower on the deployment machine, which notices the new
  # digest behind the tag and recreates the container. There is no ssh step and
  # no inbound port; see the CD section of README.md.
  # ===========================================================================

  images:
    name: Publish the ${{ matrix.service }} image
    needs: [backend, frontend, e2e, pinned-versions]
    # Never from a branch, a pull request or the weekly schedule - and inert
    # until PUBLISH_IMAGES is set, so all of this can be merged and sit unused.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.PUBLISH_IMAGES == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Docker Hub is authenticated with its own token, not GITHUB_TOKEN, so this
    # job needs nothing beyond reading the checkout.
    permissions:
      contents: read

    strategy:
      # Both images or neither. Publishing a backend whose matching web build
      # failed leaves the tags describing a combination nobody tested.
      fail-fast: true
      matrix:
        include:
          - service: backend
            dockerfile: backend/Dockerfile
          - service: web
            dockerfile: frontend/Dockerfile

    steps:
      - uses: actions/checkout@v7

      - name: Work out the image name
        id: name
        env:
          NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          if [ -z "${NAMESPACE:-}" ]; then
            echo "::error::DOCKERHUB_USERNAME is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          # Docker Hub repository names must be lowercase.
          ns=$(printf '%s' "$NAMESPACE" | tr '[:upper:]' '[:lower:]')
          echo "image=${ns}/ephemeral-rooms-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Built but NOT pushed. `load: true` puts it in the local daemon so the
      # smoke test below has something to run; the push happens further down,
      # only if that passes. This ordering is the whole safety property.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # The backend must mount a loop-backed ext4 image before Uvicorn starts,
      # so it needs the same capabilities docker-compose.yml grants it. Probing
      # /api/storage rather than / exercises settings validation, the service
      # graph and a real disk_usage() call against that mounted filesystem - so
      # this fails if the entrypoint could not build the room filesystem, which
      # is exactly the class of bug a unit test cannot see.
      - name: Smoke-test the backend image
        if: matrix.service == 'backend'
        env:
          IMAGE: ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          # --privileged, where docker-compose.yml grants only SYS_ADMIN, MKNOD
          # and the loop devices. Not laziness - a runner-specific necessity.
          #
          # The entrypoint mknod's /dev/loop0-15 into the container's private
          # /dev and lets `mount -o loop` choose one. Inside a container every
          # one of those nodes looks free, but on a GitHub runner the low-
          # numbered loop devices are already in use by the host, so mount
          # picks a busy one and fails with "cannot mount /dev/loop0
          # read-only". A privileged container gets the host's real /dev, so
          # losetup sees true state and picks a genuinely free device. The
          # narrow set works on an ordinary machine - it is what production
          # runs, and what this image was verified against by hand.
          #
          # The trade-off is honest: this proves the image WORKS, not that the
          # narrower production capability set is sufficient.
          docker run -d --name smoke --privileged \
            -e PUBLIC_ORIGIN=http://127.0.0.1:8000 \
            -p 8000:8000 "$IMAGE"

          ok=
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8000/api/storage; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "::error::the backend image did not answer /api/storage within 60s"
            docker logs smoke 2>&1 | tail -50
            exit 1
          fi

          # Prove it does the actual job, not merely that it boots.
          room=$(curl -fsS -X POST http://127.0.0.1:8000/api/rooms)
          case "$room" in
            *roomCode*) echo "created a room: $room" ;;
            *) echo "::error::POST /api/rooms returned: ${room:-<nothing>}"; docker logs smoke 2>&1 | tail -50; exit 1 ;;
          esac
          docker rm -f smoke >/dev/null

      # Nginx resolves its upstream at request time through a variable, so the
      # image starts happily with no backend behind it. That is what makes this
      # standalone check possible: it proves the config parses, the built assets
      # are in the image, and the SPA entry point is served.
      - name: Smoke-test the web image
        if: matrix.service == 'web'
        env:
          IMAGE: ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 8080:80 "$IMAGE"

          ok=
          for _ in $(seq 1 15); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/index.html; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "::error::the web image did not serve /index.html within 30s"
            docker logs smoke 2>&1 | tail -50
            exit 1
          fi

          # The bundle must actually be in there. An empty dist/ still serves a
          # 200 for index.html, so check it references a hashed asset.
          if ! curl -fsS http://127.0.0.1:8080/index.html | grep -q '/assets/'; then
            echo "::error::index.html does not reference /assets/ - the bundle is missing from the image"
            exit 1
          fi
          echo "web image serves the built bundle"
          docker rm -f smoke >/dev/null

      # Only now, with a running container behind us.
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The IMMUTABLE tag only. :latest - the tag Watchtower actually follows -
      # is moved by the `promote` job below, and only once BOTH images pass.
      #
      # This split is not theoretical. On the first real run the web image
      # published and the backend then failed its smoke test, which left
      # :latest pointing at a new frontend with no matching backend behind it.
      # `fail-fast` does not prevent that - it cancels siblings that are still
      # running, and web had already finished. A :sha- tag left behind by a
      # half-failed run is harmless, because nothing deploys from it.
      - name: Push the immutable tag
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          set -euo pipefail
          docker push "$IMAGE:sha-$GITHUB_SHA"
          echo "pushed $IMAGE:sha-$GITHUB_SHA"

  promote:
    name: Promote to :latest
    # Both matrix legs, so this cannot run while either image is missing.
    needs: [images]
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.PUBLISH_IMAGES == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    # The moment of deployment: moving :latest is what a polling Watchtower
    # acts on. Naming the environment means a required reviewer, if you add
    # one, gates the actual release rather than the build.
    environment:
      name: production
      url: https://${{ vars.DEPLOY_DOMAIN }}

    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # `imagetools create` re-points the tag inside the registry from a
      # manifest already there - no rebuild, no pull, no re-upload. The same
      # mechanism the rollback workflow uses, so the promote path and the
      # recover path are one piece of machinery with one failure mode.
      - name: Move :latest to this commit
        env:
          NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          ns=$(printf '%s' "$NAMESPACE" | tr '[:upper:]' '[:lower:]')
          for svc in backend web; do
            image="${ns}/ephemeral-rooms-${svc}"
            docker buildx imagetools create -t "$image:latest" "$image:sha-$GITHUB_SHA"
            echo "  $image:latest -> sha-$GITHUB_SHA"
          done
          {
            echo "### Released \`sha-$GITHUB_SHA\`"
            echo "- \`${ns}/ephemeral-rooms-backend:latest\`"
            echo "- \`${ns}/ephemeral-rooms-web:latest\`"
            echo ""
            echo "Watchtower will recreate \`web\` on its next poll. The backend tag moved"
            echo "but nothing restarts by itself - it is not watched, because recreating it"
            echo "destroys every live room."
          } >> "$GITHUB_STEP_SUMMARY"
