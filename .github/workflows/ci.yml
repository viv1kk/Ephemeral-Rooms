name: CI

# Runs on every branch, on pull requests, and once a week.
#
# The weekly run is not padding. The whole collaboration design rests on the
# browser's `yjs` and the server's `pycrdt` agreeing on a binary wire format,
# and that agreement can be broken by a transitive dependency without anyone
# touching this repository. A scheduled run turns "remember to re-check" into
# an email.

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    # Mondays, 04:17 UTC. Off the hour so it is not queued behind everyone
    # else's midnight cron.
    - cron: '17 4 * * 1'
  workflow_dispatch:

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '24'
  PYTHONUNBUFFERED: '1'

jobs:
  backend:
    name: Backend tests and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # `--only-binary=:all:` is an assertion, not a speed-up. Every pinned
          # dependency must publish a Linux wheel, because deploy/bootstrap.sh
          # installs with the same flag on an instance that has no compiler and
          # no Rust toolchain. Failing here means failing there, which is the
          # far cheaper place to find out.
          pip install --only-binary=:all: -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: backend
        run: pytest -q

      - name: Type check
        working-directory: backend
        run: mypy

  frontend:
    name: Frontend types and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build

      # Deployment copies this to the instance, because Node is a build-time
      # dependency only and is never installed on the server.
      - name: Upload production bundle
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  e2e:
    name: Browser end-to-end
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: -r requirements.txt
          pip install -r requirements-dev.txt

      # The suite runs Vite from source rather than from dist, so it needs
      # node_modules even though the frontend job already built a bundle.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      # Starts its own Uvicorn and Vite on ports 8010 and 5174, drives two
      # independent browser contexts against them, and proves that browser yjs
      # and server pycrdt converge on the same binary format. A pure-Python
      # test of pycrdt against itself would prove nothing about that.
      - name: Run end-to-end tests
        run: pytest e2e -q

  pinned-versions:
    name: Pinned CRDT versions match the README
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # The README records a verified five-package quintet and states that
      # upgrading any of them requires re-running the compatibility test. This
      # makes that rule enforceable: bump a version without updating the
      # README and CI stops you, rather than the mismatch being discovered
      # later as text quietly ordering differently.
      - name: Check the quintet
        run: |
          set -euo pipefail
          fail=0
          check() {
            local name=$1 version=$2
            if [ -z "$version" ]; then
              echo "::error::could not read the pinned version of $name"
              fail=1
            elif grep -qF "$version" README.md; then
              echo "  ok   $name $version"
            else
              echo "::error::$name is pinned to $version but the README does not mention that version. Update the verified quintet table, and re-run the compatibility test (e2e) before doing so."
              fail=1
            fi
          }

          check pycrdt            "$(sed -n 's/^pycrdt==\(.*\)$/\1/p'            backend/requirements.txt)"
          check pycrdt-websocket  "$(sed -n 's/^pycrdt-websocket==\(.*\)$/\1/p'  backend/requirements.txt)"
          check yjs               "$(node -p "require('./frontend/package.json').dependencies['yjs']")"
          check y-protocols       "$(node -p "require('./frontend/package.json').dependencies['y-protocols']")"
          check y-codemirror.next "$(node -p "require('./frontend/package.json').dependencies['y-codemirror.next']")"

          exit $fail

  deploy:
    name: Deploy to EC2
    # Runs only after every check above has passed. This is the whole point of
    # keeping deployment in the same workflow rather than chaining a second
    # one: the dependency is a single graph, not a fragile workflow_run trigger.
    needs: [backend, frontend, e2e, pinned-versions]

    # Three independent guards, because an accidental deployment here is not a
    # rollback - it destroys every live room (see below).
    #   1. only the main branch
    #   2. only a real push, never a PR or the weekly schedule
    #   3. only once DEPLOY_ENABLED is set, so this stays inert until an
    #      instance actually exists
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.DEPLOY_ENABLED == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Naming an environment lets you add a required reviewer in the repository
    # settings without touching this file, turning the deploy into a one-click
    # approval. Worth considering: a deploy restarts the service, and a restart
    # loses every active room and every uploaded file by design. Anyone mid-session
    # is disconnected with no warning.
    environment:
      name: production
      url: https://${{ vars.DEPLOY_DOMAIN }}

    permissions:
      contents: read
      actions: read      # to download the frontend bundle built above

    steps:
      - uses: actions/checkout@v7

      # Reuse the exact bundle CI tested rather than rebuilding it here. Node
      # is never installed on the instance, so the built assets have to travel.
      - name: Download the production bundle
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Verify the bundle arrived
        run: |
          test -f frontend/dist/index.html \
            || { echo "::error::frontend/dist/index.html is missing; bootstrap.sh would refuse to run"; exit 1; }
          echo "bundle: $(find frontend/dist -type f | wc -l) files"

      - name: Configure SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pin the host key if one is provided; otherwise trust on first use.
          # Providing DEPLOY_KNOWN_HOSTS is strictly better, because keyscan
          # accepts whatever answers on the day.
          if [ -n "${{ secrets.DEPLOY_KNOWN_HOSTS }}" ]; then
            printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Copy the application to the instance
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o BatchMode=yes" \
            --exclude '.git' --exclude 'node_modules' --exclude '.venv' \
            --exclude '__pycache__' --exclude '.pytest_cache' --exclude '.mypy_cache' \
            ./ "$USER@$HOST:/tmp/ephemeral-rooms/"

      # bootstrap.sh is idempotent, so this is both the first install and every
      # subsequent redeploy. It preflights, installs from wheels only, refuses
      # a unit file that has lost its --workers 1, and smoke-tests itself.
      - name: Run the provisioner
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$USER@$HOST" \
            "cd /tmp/ephemeral-rooms && sudo ./deploy/bootstrap.sh '$DOMAIN'"

      # Prove the deployed thing actually answers, rather than trusting that
      # the script exited zero.
      - name: Verify the live site
        env:
          DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' "https://$DOMAIN/" || echo 000)
            if [ "$code" = "200" ]; then
              echo "landing page: $code"
              room=$(curl -fsS -X POST "https://$DOMAIN/api/rooms")
              echo "created a room: $room"
              case "$room" in *roomCode*) exit 0 ;; esac
            fi
            echo "attempt $attempt: HTTP $code; retrying"
            sleep 5
          done
          echo "::error::the deployed site did not answer correctly"
          exit 1
