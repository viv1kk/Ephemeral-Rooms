name: Roll back

# Re-point a moving tag at an image that was already built, tested and
# published. Run it from the Actions tab: pick the service, paste the commit.
#
# This is the counterpart to the `images` job in ci.yml, and the reason that job
# pushes an immutable :sha- tag beside :latest - every commit ever deployed is
# still in the registry under its own name, so a rollback is a re-tag rather
# than a rebuild of older source.
#
# Nothing is rebuilt, nothing is pulled to the runner, and nothing is copied to
# the deployment machine. `imagetools create` rewrites the tag inside the
# registry from the manifest that is already there. Watchtower notices the new
# digest behind :latest on its next poll and recreates the container by itself -
# so a rollback travels the same path a deployment does, which is the path you
# have actually tested.
#
#   !!  Rolling `backend` back recreates it, which destroys every live room,
#   !!  document and upload - unattended, at whatever moment the poll lands.
#   !!  That is the accepted trade for a rollback that completes on its own.
#   !!  To have it land now rather than within a poll interval, on the machine:
#   !!
#   !!      docker compose pull && docker compose up -d

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Which image to roll back'
        required: true
        type: choice
        options: [web, backend, both]
        default: web
      sha:
        description: 'Full commit SHA to roll back TO (the :sha- tag must exist)'
        required: true
        type: string

concurrency:
  group: rollback
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rollback:
    name: Re-point :latest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Same environment as a deploy, so any reviewer requirement you have set
    # applies to rolling back too.
    environment:
      name: production

    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Re-point the tag
        env:
          NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
          SERVICE: ${{ inputs.service }}
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          ns=$(printf '%s' "$NAMESPACE" | tr '[:upper:]' '[:lower:]')

          case "$SERVICE" in
            both) services="backend web" ;;
            *)    services="$SERVICE" ;;
          esac

          for svc in $services; do
            image="${ns}/ephemeral-rooms-${svc}"

            # Fail loudly if the target does not exist, rather than creating a
            # :latest that points at nothing.
            if ! docker buildx imagetools inspect "$image:sha-$SHA" >/dev/null 2>&1; then
              echo "::error::$image:sha-$SHA does not exist. Check the commit SHA, and that a build for it was published."
              exit 1
            fi

            docker buildx imagetools create -t "$image:latest" "$image:sha-$SHA"
            echo "  $image:latest -> sha-$SHA"
          done

          {
            echo "### Rolled back to \`$SHA\`"
            for svc in $services; do echo "- \`${ns}/ephemeral-rooms-${svc}:latest\`"; done
            echo ""
            echo "Watchtower recreates the affected container(s) on its next poll."
            if [ "$SERVICE" != "web" ]; then
              echo ""
              echo "> Rolling the backend back destroys every live room, document and upload."
              echo "> To land it now instead of waiting for the poll, on the machine:"
              echo "> \`docker compose pull && docker compose up -d\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
