# Three containers: Uvicorn holding all the room state, Nginx serving the built
# frontend and proxying /api and /ws to it, and cloudflared carrying public
# traffic in from the Cloudflare edge. The first two are the systemd deployment
# in deploy/, packaged; the third replaces the inbound half of it entirely,
# which is why no port needs to be open to the internet.
#
#     docker compose up -d --build       # then http://127.0.0.1:8080
#
# Machine-specific values - the tunnel UUID, its credentials file, the public
# origin - come from `.env` beside this file. See .env.example.
#
# Everything restarts by itself: `unless-stopped` brings all three back when
# the machine reboots, when Docker restarts, and when a container crashes.
# That depends on one setting outside this file - Docker Desktop must be set to
# start when you log in, or nothing here is running to be restarted. See the
# "Keeping it running" part of the Docker section in README.md.
#
#   !!  DO NOT scale the backend. `docker compose up --scale backend=2` is not
#   !!  a performance knob here - it is two separate, invisible copies of the
#   !!  application. Every room, document, presence entry, session token and
#   !!  disk reservation lives in one process's memory (spec section 20.1).
#   !!  One replica, one worker. Both files say so in more detail.

services:
  backend:
    # Published by CI to Docker Hub. DOCKERHUB_NAMESPACE lives in .env, so no
    # account name is hardcoded here; BACKEND_IMAGE overrides the whole
    # reference when you promote or roll back to a specific :sha- tag.
    #
    # Deliberately NOT labelled for Watchtower. Recreating this container
    # destroys every live room, document, presence entry and uploaded file, so
    # it is never updated unattended - you promote it, at a moment you choose:
    #
    #     docker compose pull backend && docker compose up -d backend
    image: ${BACKEND_IMAGE:-${DOCKERHUB_NAMESPACE:?set DOCKERHUB_NAMESPACE in .env - see .env.example}/ephemeral-rooms-backend:latest}
    build:
      # Repository root, so both images share one .dockerignore and the web
      # image can reach deploy/security-headers.conf.
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped

    # Deliberately no `ports:`. The backend is reachable only from the web
    # container, over the compose network, and that is what makes
    # `--forwarded-allow-ips '*'` in the Dockerfile safe: nothing else can
    # reach the port to forge an X-Forwarded-Proto. Publishing it would break
    # that, and would also bypass every security header Nginx adds.
    expose:
      - "8000"

    environment:
      # The public origin, used in logs and for anything that needs to name
      # itself. Set this to the real https:// URL when you deploy; no domain is
      # hardcoded anywhere in the source (spec section 31).
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://127.0.0.1:8080}

      # Off by default, and this matters. The web container terminates plain
      # HTTP, so it forwards X-Forwarded-Proto: http - which, with this on,
      # makes the application 301 every request to an https:// URL that
      # nothing is listening on. Turn it on only once a TLS terminator sits in
      # front of the web container and forwards X-Forwarded-Proto: https,
      # where it then protects the plain-HTTP hop that terminator might expose
      # (see backend/app/security.py).
      REDIRECT_HTTP_TO_HTTPS: ${REDIRECT_HTTP_TO_HTTPS:-false}

      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # ------------------------------------------------ The 10 GB room storage
      #
      # The ceiling is the filesystem itself, not a setting. The entrypoint
      # mounts a fixed-size ext4 image at DATA_ROOT on every start, so statvfs
      # reports 10 GB and the kernel returns ENOSPC past it. Size it with
      # ROOM_DISK_SIZE below, not here.
      #
      # The application's own ceiling is therefore off. Its enforcement is
      # equivalent but redundant now, and two limits that can disagree is one
      # more thing to reason about; set it if you ever want a budget SMALLER
      # than the filesystem.
      MAX_TOTAL_STORAGE_BYTES: ${MAX_TOTAL_STORAGE_BYTES:-0}

      # Still worth keeping with a real filesystem underneath: this is what
      # stops the volume being filled to the very last byte, where the reaper
      # and the cleanup paths would themselves have no room to work.
      DISK_HEADROOM_BYTES: ${DISK_HEADROOM_BYTES:-536870912}

      # Size of the room filesystem, read by the entrypoint. Changing this does
      # NOT resize an image that already exists - the entrypoint only creates
      # one when it is missing. To resize: `docker compose down -v`, which
      # discards the image, then bring the stack back up.
      ROOM_DISK_SIZE: ${ROOM_DISK_SIZE:-10G}

      # One room cannot swallow the whole budget. Nothing above enforces a
      # per-room share - the global free-space check is first-come-first-served -
      # so without this a single room could fill the disk and every other room
      # would be refused its next upload. 0 restores unlimited.
      MAX_ROOM_TOTAL_BYTES: ${MAX_ROOM_TOTAL_BYTES:-2147483648}

      # Every other knob in backend/.env.example works here too - add it as a
      # line above. Values are validated at startup, so a malformed one fails
      # the container immediately rather than at the first request.

    # Enough privilege to mount a loop-backed filesystem, and no more.
    # `privileged: true` would also work and is what most examples reach for;
    # it is not needed, and it would hand the container the whole host device
    # tree to cap one directory. The entrypoint gives all of this up before
    # Uvicorn starts.
    cap_add:
      - SYS_ADMIN   # mount(2)
      - MKNOD       # create the /dev/loopN nodes, absent from a container's /dev
    devices:
      - /dev/loop-control
    device_cgroup_rules:
      - 'b 7:* rmw'  # block major 7 = loop devices

    volumes:
      # The BACKING STORE, not the room files. It holds one sparse ext4 image,
      # which the entrypoint mounts at DATA_ROOT - so the room files live inside
      # a filesystem of fixed size rather than directly on this volume, which is
      # what gives statvfs a real ceiling to report.
      #
      # Sparse, so the host only gives up what is actually written. Nothing here
      # is meant to survive either: the server deletes everything under the data
      # root on every startup (spec sections 15, 19), and `docker compose down
      # -v` discards the image itself, which is also how you resize it.
      - room-backing:/backing

    # The image's HEALTHCHECK gates the web container's startup below.

  web:
    image: ${WEB_IMAGE:-${DOCKERHUB_NAMESPACE:?set DOCKERHUB_NAMESPACE in .env - see .env.example}/ephemeral-rooms-web:latest}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped

    # The one container Watchtower is allowed to update by itself. Recreating
    # Nginx drops inbound connections and nothing else - no room, document or
    # upload lives in this container - so a new frontend build can land
    # unattended. The backend cannot; see the note on that service.
    labels:
      com.centurylinklabs.watchtower.enable: "true"

    ports:
      # Loopback only. Put a TLS terminator in front for anything public;
      # override with HTTP_PORT, or drop the 127.0.0.1 prefix knowingly.
      - "127.0.0.1:${HTTP_PORT:-8080}:80"

    depends_on:
      backend:
        # Wait for /api/storage to answer, not merely for the container to
        # exist, so the first page load cannot race the backend's boot sweep.
        condition: service_healthy

  # ------------------------------------------------------------------- tunnel
  #
  # Routing only. It holds no application state, terminates nothing, and knows
  # nothing about rooms - it dials out to the Cloudflare edge and forwards what
  # arrives to Nginx. Restarting it drops inbound connections and nothing else;
  # restarting the backend is what loses rooms.
  #
  # Because the connection is outbound, the host needs no inbound port open,
  # no public IP and no certificate: TLS is terminated at the Cloudflare edge.
  # That is also why `web` publishes only to 127.0.0.1 - the tunnel reaches it
  # over the compose network, not through the host's port.
  tunnel:
    # Pinned, like everything else here. cloudflared self-updates by default;
    # the image's entrypoint already passes --no-autoupdate, so the version you
    # get is the version you asked for. Bump it deliberately - Cloudflare does
    # eventually stop accepting very old clients.
    image: cloudflare/cloudflared:2026.9.0
    restart: unless-stopped

    depends_on:
      web:
        # Nothing should be publicly reachable before Nginx can answer, or the
        # first visitor after a reboot gets a 502 from the edge.
        condition: service_healthy

    # `--url` instead of an ingress config file, deliberately. This tunnel
    # serves one hostname backed by one service, which is exactly what --url
    # expresses - and it keeps the hostname out of the repository, where
    # nothing else hardcodes a domain either (spec section 31). The hostname
    # lives in the Cloudflare DNS record that points at this tunnel's UUID.
    #
    # Add deploy/docker/cloudflared/config.yml and mount it at
    # /etc/cloudflared/config.yml if you ever need real ingress rules - several
    # hostnames, path routing, per-origin timeouts.
    #
    # http://web:80, not the backend: everything public goes through Nginx, so
    # static assets, the SPA fallback and the security headers all behave the
    # same way they do locally.
    command: >-
      tunnel
      --metrics 0.0.0.0:2000
      --url http://web:80
      run
      ${CF_TUNNEL_ID:?set CF_TUNNEL_ID in .env - see .env.example}

    volumes:
      # Just the one credentials file, read-only. Not the whole ~/.cloudflared
      # directory: cert.pem in there is an account-wide credential that can
      # create and delete tunnels, and `tunnel run` does not need it when the
      # tunnel is identified by UUID.
      - ${CF_CREDENTIALS_FILE:?set CF_CREDENTIALS_FILE in .env - see .env.example}:/etc/cloudflared/creds.json:ro

    environment:
      # Passed by environment rather than as a flag because --cred-file is a
      # subcommand option and would have to sit after `run`, which is easy to
      # get wrong when editing the command above.
      TUNNEL_CRED_FILE: /etc/cloudflared/creds.json

    ports:
      # Readiness and metrics, on loopback only. `curl 127.0.0.1:2000/ready`
      # reports how many edge connections are established - the one honest
      # answer to "is the site actually up?". The image is distroless with no
      # shell, so it carries no HEALTHCHECK of its own; this is the substitute.
      - "127.0.0.1:${TUNNEL_METRICS_PORT:-2000}:2000"


  # ---------------------------------------------------------------- watchtower
  #
  # The continuous-deployment half. It polls Docker Hub for a new digest behind
  # the `web` image's tag and, when one appears, pulls it and recreates that one
  # container. Nothing is pushed to this machine and no port is opened: the poll
  # is outbound, the same direction as the tunnel, which is what lets the whole
  # stack keep its "no inbound port" property.
  #
  # Behind a profile, so it is opt-in. `docker compose up -d` on a laptop should
  # not silently start something that replaces containers from a registry:
  #
  #     docker compose --profile watchtower up -d      # deployment machine
  #     docker compose up -d                           # everywhere else
  #
  # Once started it stays started - `unless-stopped` outlives reboots without
  # naming the profile again.
  #
  #   !!  MOUNTING THE DOCKER SOCKET IS ROOT-EQUIVALENT on this machine. Anyone
  #   !!  who can reach this container can control every container on the host.
  #   !!  That is inherent to how Watchtower works, and the reason it is pinned
  #   !!  to a digestible version and given a read-only socket is not available.
  #   !!  Do not publish a port from this service, and do not add others to it.
  watchtower:
    # The nicholas-fedor fork, not containrrr/watchtower, and this is not a
    # preference - the original is broken against the Docker daemon on this
    # machine. containrrr/watchtower:1.7.1 (its last release) defaults to Docker
    # API v1.25, Docker Engine 29 refuses anything below v1.40, and the result
    # is not a clean error but a nil-pointer panic in the metrics package. It
    # can be forced to work by pinning DOCKER_API_VERSION=1.44, but that is a
    # workaround on an unmaintained tool that mounts the Docker socket, and
    # v1.44 will eventually be dropped too. This fork is maintained and
    # negotiates the API version by itself - verified here answering on v1.55.
    #
    # It reads the same com.centurylinklabs.watchtower.enable label, so it is a
    # drop-in swap if you ever want to move back.
    image: nickfedor/watchtower:1.22.1
    restart: unless-stopped
    profiles: ["watchtower"]

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    environment:
      # Opt-in, not opt-out. Only containers carrying
      # com.centurylinklabs.watchtower.enable=true are considered, which today
      # is `web` alone. `backend` is excluded because recreating it destroys
      # every live room; `tunnel` because its version is pinned deliberately and
      # Cloudflare occasionally ships breaking client changes.
      WATCHTOWER_LABEL_ENABLE: "true"

      # Remove the superseded image after a successful update. Without this the
      # old layers stay on disk after every deploy.
      WATCHTOWER_CLEANUP: "true"

      # Seconds between registry checks. Every check is a manifest request that
      # counts against Docker Hub's pull limit, so this is a rate-limit dial as
      # much as a latency one - see the CD section of README.md before lowering
      # it. One image at 15 minutes is ~96 checks a day.
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-900}

      # Give Nginx time to finish in-flight responses instead of being killed.
      WATCHTOWER_TIMEOUT: 30s

      # Authenticate the poll. Optional for a public image, but anonymous pulls
      # are rate-limited far more aggressively than authenticated ones, and a
      # limit reached here looks exactly like "the deploy silently stopped
      # working". Use a SEPARATE, READ-ONLY Docker Hub token here - not the
      # read/write one CI pushes with - so this socket-mounted container cannot
      # publish images even if it is compromised.
      REPO_USER: ${DOCKERHUB_USERNAME:-}
      REPO_PASS: ${DOCKERHUB_READ_TOKEN:-}


volumes:
  room-backing:
