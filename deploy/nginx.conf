# Nginx site for the ephemeral rooms server.
#
# Install to /etc/nginx/sites-available/ephemeral-rooms and symlink into
# sites-enabled. Replace example.com with your domain; nothing else in the
# project hardcodes a domain (spec section 31).
#
# The TLS block below is what certbot produces. Run:
#     sudo certbot --nginx -d example.com -d www.example.com
# and it will fill in the certificate lines itself.

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # Leave this reachable on port 80: ACME uses it for renewal.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com www.example.com;

    # certbot manages these two lines.
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    # Uploads are unbounded here; the application enforces its own limits and
    # its reservation ledger is the thing that actually protects the disk
    # (spec section 17).
    client_max_body_size 0;

    # Without this, Nginx buffers the entire upload body to disk before
    # forwarding it, which doubles transient disk usage during large uploads
    # and puts bytes on disk outside the reservation ledger's accounting
    # (spec section 29).
    proxy_request_buffering off;

    # The built frontend is served directly from disk, never proxied through
    # Uvicorn (spec section 30).
    root /opt/ephemeral-rooms/frontend/dist;
    index index.html;

    location /assets/ {
        # Vite emits content-hashed filenames, so these are immutable.
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Must comfortably exceed WS_HEARTBEAT_INTERVAL_MS (default 20s), or
        # the proxy will cut idle sockets before the first ping arrives. Do not
        # raise the heartbeat interval without raising these too
        # (spec section 2.1).
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
    }

    # Client-side routing: /room/4827 is a React route, not a file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
