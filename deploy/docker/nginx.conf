# Nginx site for the containerised deployment.
#
# This is deploy/nginx.conf adapted to the compose network, and the diff is
# worth understanding before changing either file:
#
#   * Plain HTTP on port 80, no TLS block and no certbot lines. The container
#     is not the edge. Terminate TLS in front of it - a host Nginx, Traefik,
#     Caddy, a cloud load balancer, a Cloudflare tunnel - and forward here.
#   * The upstream is the `backend` service by name, not 127.0.0.1:8000.
#   * Static files come from /usr/share/nginx/html, baked into the image at
#     build time, rather than from /opt/ephemeral-rooms/frontend/dist.
#
# Everything else - the buffering rules, the timeouts, the header snippet in
# two places - is identical, and identical for the same reasons.

# Preserve the scheme the *browser* used. If something upstream already
# terminated TLS and said so, pass its word through unchanged; otherwise report
# our own scheme. This is what lets the application decide correctly whether to
# send HSTS, and whether REDIRECT_HTTP_TO_HTTPS should fire (see
# backend/app/security.py).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Docker's embedded DNS. Resolving the upstream at request time, through a
    # variable, rather than once at startup: with a literal `proxy_pass
    # http://backend:8000` Nginx resolves the name when it loads its config and
    # caches that address forever, so a backend container that restarts with a
    # new IP becomes permanently unreachable - and the first start races
    # against the backend existing at all.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $upstream "backend:8000";

    include /etc/nginx/snippets/ephemeral-rooms-security.conf;

    # Uploads are unbounded here; the application enforces its own limits and
    # its reservation ledger is the thing that actually protects the disk
    # (spec section 17).
    client_max_body_size 0;

    # Without this, Nginx buffers the entire upload body to disk before
    # forwarding it, which doubles transient disk usage during large uploads
    # and puts bytes on disk outside the reservation ledger's accounting
    # (spec section 29). In a container that disk is the writable layer, which
    # makes it worse, not better.
    proxy_request_buffering off;

    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        # Vite emits content-hashed filenames, so these are immutable.
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Re-included deliberately: declaring any add_header in a location
        # discards every add_header inherited from the server block, so
        # without this line these responses would carry no security headers
        # at all. This is the single most common way an nginx CSP goes
        # missing without anyone noticing.
        include /etc/nginx/snippets/ephemeral-rooms-security.conf;
        try_files $uri =404;
    }

    location /ws {
        # $request_uri, including the query string, because a proxy_pass whose
        # target is a variable does not pass the original URI on its own the
        # way a literal one does.
        proxy_pass http://$upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # Must comfortably exceed WS_HEARTBEAT_INTERVAL_MS (default 20s), or
        # the proxy will cut idle sockets before the first ping arrives. Do not
        # raise the heartbeat interval without raising these too
        # (spec section 2.1).
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://$upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
    }

    # Client-side routing: /room/4827 is a React route, not a file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
