# Security response headers, kept in one file and included wherever they are
# needed.
#
# The reason this is a separate file rather than four lines in the server block
# is an nginx rule that catches people out: `add_header` directives are
# inherited by a location ONLY IF that location declares no add_header of its
# own. The /assets/ location sets Cache-Control, which silently discards every
# header inherited from the server block for that location. Including this
# snippet in both places is the fix.
#
# The application sets the same headers itself (backend/app/security.py), so
# proxied responses carry them even if this file is ever missed. A duplicated
# CSP is not a problem: the browser enforces the intersection of the policies.

# See backend/app/security.py for why each directive is what it is. The two
# worth knowing: script-src needs no 'unsafe-inline' because the built page has
# no inline script, and style-src does need it because CodeMirror injects its
# theme at runtime and y-codemirror paints remote selections with a style
# attribute. Removing it makes every collaborator's highlight invisible.
add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'" always;

# Two years, subdomains, preload-eligible. Only meaningful over HTTPS, and this
# file is only included in the TLS server block.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# Room codes are in the URL and should never travel in a Referer header.
add_header Referrer-Policy "no-referrer" always;

add_header X-Content-Type-Options "nosniff" always;

# Redundant with frame-ancestors above, kept for anything predating CSP3.
add_header X-Frame-Options "DENY" always;

add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
